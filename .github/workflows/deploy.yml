name: BIST Web Sitesini Yayinla

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: GitHub Pages Icin Hazirla
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pagese Yayinla
        id: deployment
        uses: actions/deploy-pages@v4