name: BIST Web Sitesini Guncelle ve Yayinla

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 7-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bagimliliklari Yukle
        run: npm install

      - name: Web Sayfasini Uret
        run: node build-web.js

      - name: GitHub Pages Icin Hazirla
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pagese Yayinla
        id: deployment
        uses: actions/deploy-pages@v4