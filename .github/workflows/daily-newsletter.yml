name: Sabah Bulteni Otomatik Gonder

on:
  schedule:
    # Hafta ici her sabah 06:00 UTC = 09:00 TSI (Seans oncesi)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

jobs:
  send-morning-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Paketleri Kur
        run: npm ci || npm install

      - name: Guncel Verileri Cek
        run: node fetch-data.js

      - name: Sabah Bultenini Gonder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_RECIPIENT: ${{ secrets.NEWSLETTER_RECIPIENT }}
        run: node send-newsletter.js