name: Sabah Bulteni Otomatik Gonder

on:
  schedule:
    # Hafta ici her sabah 05:45 UTC = 08:45 TSI (GitHub Actions kuyruk gecikmesini onlemek icin tepe saat olmayan :45 dakikasi secildi)
    - cron: '45 5 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [send_newsletter]

jobs:
  send-morning-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Paketleri Kur
        run: npm ci || npm install

      - name: Guncel Verileri Cek
        run: node fetch-data.js

      - name: Sabah Bultenini Gonder
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_RECIPIENT: ${{ secrets.NEWSLETTER_RECIPIENT }}
        run: node send-newsletter.js