<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabah Bültenine Abone Ol | BIST Portalı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6 text-center">
    
    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 mx-auto flex items-center justify-center font-black text-2xl text-white shadow-lg shadow-sky-500/20">
      ✉️
    </div>

    <div>
      <h1 class="text-2xl font-black text-white">Sabah Piyasa Bülteni</h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-2">
        Her iş günü sabah 09:00'da dünün BIST 100, BIST 30, BIST Banka ve Gram Altın kapanış puanları e-posta kutunuza gelsin.
      </p>
    </div>

    <!-- Formspree Entegre Form -->
    <form id="subscribeForm" onsubmit="handleFormspree(event)" class="space-y-3">
      <input 
        type="email" 
        name="email"
        id="emailInput" 
        placeholder="E-posta adresinizi girin..." 
        required 
        class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all"
      />
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full bg-sky-600 hover:bg-sky-500 active:scale-95 transition-all text-white text-sm font-bold py-3 rounded-xl shadow-lg shadow-sky-600/20 cursor-pointer"
      >
        Ücretsiz Abone Ol
      </button>
    </form>

    <div id="statusMsg" class="hidden text-xs font-semibold p-3 rounded-xl"></div>

    <div class="pt-4 border-t border-slate-800/80">
      <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-white transition-colors">
        ← Ana Sayfaya Dön
      </a>
    </div>
  </div>

  <script>
    const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xppzzwwy';

    async function handleFormspree(e) {
      e.preventDefault();
      const form = document.getElementById('subscribeForm');
      const emailInput = document.getElementById('emailInput');
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMsg');

      const userEmail = emailInput.value.trim();

      btn.disabled = true;
      btn.textContent = 'Kaydediliyor...';
      msg.classList.add('hidden');

      try {
        const response = await fetch(FORMSPREE_ENDPOINT, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          msg.className = 'text-xs font-semibold p-3 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 block text-emerald-400';
          msg.textContent = `Tebrikler! ${userEmail} adresi bülten listesine başarıyla eklendi.`;
          form.reset();
          btn.textContent = 'Abone Olundu ✓';
        } else {
          throw new Error('Form iletilemedi');
        }
      } catch (err) {
        msg.className = 'text-xs font-semibold p-3 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/20 block text-rose-400';
        msg.textContent = 'Kayıt sırasında bir hata oluştu. Lütfen tekrar deneyin.';
        btn.disabled = false;
        btn.textContent = 'Tekrar Dene';
      }
    }
  </script>
</body>
</html>
