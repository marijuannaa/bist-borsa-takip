<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIST Hisse Detay & Canlı Grafik</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .skeleton-loader {
      animation: pulse-subtle 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      background-color: #1e293b;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 antialiased">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Üst Navigasyon & Arama -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
      <a href="index.html" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-300 hover:text-white transition-colors bg-slate-900 border border-slate-800 hover:border-slate-700 px-4 py-2 rounded-xl shadow-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span>Ana Sayfaya Dön</span>
      </a>

      <!-- Hisse Arama Çubuğu -->
      <div class="flex items-center gap-2">
        <div class="relative w-full sm:w-64">
          <input 
            type="text" 
            id="navSearchInput" 
            placeholder="Başka hisse incele (örn: ASELS)..." 
            class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3.5 py-2 pl-9 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 uppercase transition-all"
            onkeypress="if(event.key==='Enter') searchNavigate()"
          />
          <svg class="w-3.5 h-3.5 text-slate-500 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <button onclick="searchNavigate()" class="bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold px-3 py-2 rounded-xl transition-all">
          Git
        </button>
      </div>
    </header>

    <!-- Hisse Başlık ve Fiyat Kartı -->
    <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-6 relative overflow-hidden">
      <div>
        <div class="flex items-center gap-3">
          <h1 id="stockSymbol" class="text-3xl sm:text-4xl font-black tracking-tight text-white skeleton-loader h-10 w-28 rounded-lg"></h1>
          <span id="stockBadge" class="text-xs font-bold px-3 py-1 rounded-full bg-slate-800 text-slate-400">Yükleniyor...</span>
        </div>
        <p id="stockLongName" class="text-slate-400 text-sm mt-1.5 skeleton-loader h-4 w-60 rounded"></p>
        <div class="flex items-center gap-2 mt-2">
          <span id="stockCurrency" class="text-[11px] font-semibold text-slate-400 bg-slate-800 px-2.5 py-0.5 rounded border border-slate-700">TRY</span>
          <span id="stockMarketTime" class="text-[11px] text-slate-500">CDN Yüksek Hızlı Senkronizasyon</span>
        </div>
      </div>

      <div class="text-left md:text-right">
        <div id="stockPrice" class="text-3xl sm:text-4xl font-black tracking-tight text-white skeleton-loader h-10 w-36 rounded-lg ml-auto"></div>
        <div id="stockChange" class="text-sm sm:text-base font-semibold text-slate-400 mt-1">--</div>
      </div>
    </div>

    <!-- Grafik Kartı ve Zaman Aralığı Seçici -->
    <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-6 shadow-xl space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-800/80 pb-4">
        <div>
          <h2 class="text-lg font-bold text-slate-200">Fiyat Grafiği ve Geçmiş Trend</h2>
          <p id="chartSubTitle" class="text-xs text-slate-500">Yükleniyor...</p>
        </div>

        <!-- Zaman Periyotları -->
        <div class="flex flex-wrap items-center gap-1.5 bg-slate-950 p-1.5 rounded-xl border border-slate-800/80 self-start sm:self-auto">
          <button onclick="setFilter(7, this)" class="period-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all">1H</button>
          <button onclick="setFilter(30, this)" class="period-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 text-white transition-all">1A</button>
          <button onclick="setFilter(90, this)" class="period-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all">3A</button>
          <button onclick="setFilter(180, this)" class="period-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all">6A</button>
          <button onclick="setFilter(365, this)" class="period-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all">1Y</button>
        </div>
      </div>

      <!-- Canvas Alanı -->
      <div class="h-72 sm:h-96 w-full relative">
        <canvas id="detailChart"></canvas>
      </div>
    </div>

    <!-- Dinamik Finansal İstatistikler -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3.5">
      <div class="bg-slate-900/90 border border-slate-800/80 p-4 rounded-xl">
        <span class="text-xs text-slate-500 font-medium block">52 Haftalık En Yüksek</span>
        <span id="statHigh52" class="text-base sm:text-lg font-bold text-slate-200 mt-1 block skeleton-loader h-6 w-24 rounded"></span>
      </div>
      <div class="bg-slate-900/90 border border-slate-800/80 p-4 rounded-xl">
        <span class="text-xs text-slate-500 font-medium block">52 Haftalık En Düşük</span>
        <span id="statLow52" class="text-base sm:text-lg font-bold text-slate-200 mt-1 block skeleton-loader h-6 w-24 rounded"></span>
      </div>
      <div class="bg-slate-900/90 border border-slate-800/80 p-4 rounded-xl">
        <span class="text-xs text-slate-500 font-medium block">Günün Fiyat Aralığı</span>
        <span id="statDayRange" class="text-xs sm:text-sm font-bold text-slate-200 mt-1.5 block truncate skeleton-loader h-6 w-32 rounded"></span>
      </div>
      <div class="bg-slate-900/90 border border-slate-800/80 p-4 rounded-xl">
        <span class="text-xs text-slate-500 font-medium block">Hacim</span>
        <span id="statVolume" class="text-base sm:text-lg font-bold text-slate-200 mt-1 block skeleton-loader h-6 w-24 rounded"></span>
      </div>
    </div>

    <!-- Yasal Uyarı -->
    <footer class="mt-8 border-t border-slate-800/80 pt-6 pb-6 text-center text-xs text-slate-500 space-y-2">
      <p>Bu sayfadaki veriler ve grafikler genel bilgilendirme amaçlıdır. Yatırım tavsiyesi niteliği taşımaz.</p>
    </footer>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let currentSymbol = (urlParams.get('sembol') || urlParams.get('symbol') || 'THYAO').toUpperCase();
    let currentDays = 30;
    let fullHistory = [];
    let isPositiveTrend = true;
    let chartInstance = null;

    function formatNumber(val) {
      if (val === null || val === undefined || isNaN(val)) return '-';
      return Number(val).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatVolume(vol) {
      if (!vol || isNaN(vol)) return '-';
      if (vol >= 1e9) return (vol / 1e9).toFixed(2) + ' Mlr';
      if (vol >= 1e6) return (vol / 1e6).toFixed(2) + ' Mn';
      return Number(vol).toLocaleString('tr-TR');
    }

    async function loadStockDetails() {
      try {
        const res = await fetch(`data.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error('data.json yüklenemedi');
        const rootData = await res.json();
        
        const item = rootData.stocks?.[currentSymbol];
        if (!item) {
          document.getElementById('chartSubTitle').textContent = `${currentSymbol} listelenen hisseler arasında bulunamadı.`;
          return;
        }

        const isPos = item.change >= 0;
        isPositiveTrend = isPos;

        document.title = `${currentSymbol} - ₺${formatNumber(item.price)} | BIST Canlı Detay`;

        const symEl = document.getElementById('stockSymbol');
        symEl.classList.remove('skeleton-loader');
        symEl.textContent = currentSymbol;

        const nameEl = document.getElementById('stockLongName');
        nameEl.classList.remove('skeleton-loader');
        nameEl.textContent = item.shortName || currentSymbol;

        const priceEl = document.getElementById('stockPrice');
        priceEl.classList.remove('skeleton-loader');
        priceEl.textContent = `₺${formatNumber(item.price)}`;

        const changeEl = document.getElementById('stockChange');
        changeEl.className = `text-sm sm:text-base font-semibold ${isPos ? 'text-emerald-400' : 'text-rose-400'} mt-1`;
        changeEl.textContent = `${isPos ? '▲ +' : '▼ '}₺${formatNumber(item.change)} (%${item.changePercent.toFixed(2)})`;

        const badgeEl = document.getElementById('stockBadge');
        badgeEl.className = `text-xs font-bold px-3 py-1 rounded-full ${isPos ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'}`;
        badgeEl.textContent = `${isPos ? '+' : ''}${item.changePercent.toFixed(2)}%`;

        const h52 = document.getElementById('statHigh52');
        h52.classList.remove('skeleton-loader');
        h52.textContent = item.fiftyTwoWeekHigh ? `₺${formatNumber(item.fiftyTwoWeekHigh)}` : '-';

        const l52 = document.getElementById('statLow52');
        l52.classList.remove('skeleton-loader');
        l52.textContent = item.fiftyTwoWeekLow ? `₺${formatNumber(item.fiftyTwoWeekLow)}` : '-';

        const dRange = document.getElementById('statDayRange');
        dRange.classList.remove('skeleton-loader');
        dRange.textContent = (item.dayLow && item.dayHigh)
          ? `₺${formatNumber(item.dayLow)} - ₺${formatNumber(item.dayHigh)}`
          : '-';

        const vol = document.getElementById('statVolume');
        vol.classList.remove('skeleton-loader');
        vol.textContent = formatVolume(item.volume);

        fullHistory = item.history || [];
        updateChartSlice();

      } catch (err) {
        console.error('Veri yükleme hatası:', err);
        document.getElementById('chartSubTitle').textContent = 'Veriler okunurken hata oluştu.';
      }
    }

    function updateChartSlice() {
      if (!fullHistory || fullHistory.length === 0) return;

      const sliceData = fullHistory.slice(-currentDays);
      const labels = sliceData.map(h => h.date);
      const prices = sliceData.map(h => h.close);

      renderChart(labels, prices, isPositiveTrend);

      document.getElementById('chartSubTitle').textContent = 
        `${labels.length} günün verisi • Son Fiyat: ₺${formatNumber(prices[prices.length - 1])} (${labels[labels.length - 1]})`;
    }

    function renderChart(labels, prices, isPositive) {
      const ctx = document.getElementById('detailChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const color = isPositive ? '#10b981' : '#f43f5e';
      const gradient = ctx.createLinearGradient(0, 0, 0, 320);
      gradient.addColorStop(0, isPositive ? 'rgba(16, 185, 129, 0.35)' : 'rgba(244, 63, 94, 0.35)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: `${currentSymbol} Fiyat (₺)`,
            data: prices,
            borderColor: color,
            backgroundColor: gradient,
            fill: true,
            tension: 0.25,
            borderWidth: 2.5,
            pointRadius: labels.length > 40 ? 1 : 3,
            pointHoverRadius: 6,
            pointBackgroundColor: color,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#0f172a',
              titleColor: '#94a3b8',
              bodyColor: '#f8fafc',
              borderColor: '#334155',
              borderWidth: 1,
              padding: 10,
              displayColors: false,
              callbacks: {
                label: (context) => `₺${context.parsed.y.toLocaleString('tr-TR', { minimumFractionDigits: 2 })}`
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(51, 65, 85, 0.2)' },
              ticks: { color: '#64748b', maxTicksLimit: 10 }
            },
            y: {
              grid: { color: 'rgba(51, 65, 85, 0.2)' },
              ticks: { 
                color: '#64748b',
                callback: (val) => '₺' + val
              }
            }
          }
        }
      });
    }

    function setFilter(days, btnEl) {
      currentDays = days;
      document.querySelectorAll('.period-btn').forEach(btn => {
        btn.className = 'period-btn px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all';
      });
      btnEl.className = 'period-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-sky-600 text-white transition-all';
      updateChartSlice();
    }

    function searchNavigate() {
      const val = document.getElementById('navSearchInput').value.trim().toUpperCase();
      if (!val) return;
      window.location.href = `hisse.html?sembol=${val}`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadStockDetails();
    });
  </script>
</body>
</html>
